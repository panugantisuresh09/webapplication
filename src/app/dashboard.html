<div class="app-layout">
  <aside class="sidebar">
    <a class="sidebar-brand" routerLink="/dashboard">
      <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <span>Commerce</span>
    </a>

    <div class="workspace-switcher">
      <span class="workspace-avatar">CP</span>
      <span><strong>Admin Panel Menu</strong><small>Platform Owner</small></span>
      <span class="switcher-chevron">⌄</span>
    </div>

    <nav class="side-navigation" aria-label="Platform owner menu">
      <a class="nav-link" routerLink="/dashboard" routerLinkActive="active">
        <span class="nav-icon">▦</span>Dashboard
      </a>
      <a class="nav-link" routerLink="/vendors" routerLinkActive="active">
        <span class="nav-icon">♙</span>Vendors
      </a>
      <a class="nav-link" routerLink="/catalog" routerLinkActive="active">
        <span class="nav-icon">◇</span>Catalog
      </a>
      <a class="nav-link" routerLink="/orders" routerLinkActive="active">
        <span class="nav-icon">▤</span>Orders
      </a>
      <a class="nav-link" routerLink="/finance" routerLinkActive="active">
        <span class="nav-icon">◈</span>Finance
      </a>
    </nav>

    <div class="sidebar-bottom">
      <a href="#help"><span class="nav-icon">?</span>Help &amp; support</a>
      <div class="sidebar-user">
        <span class="user-avatar">PO</span>
        <span><strong>Platform Owner</strong><small>Administrator</small></span>
        <button type="button" routerLink="/login" aria-label="Sign out" title="Sign out">⎋</button>
      </div>
    </div>
  </aside>

  <main class="main-workspace">
    <header class="topbar">
      <div class="breadcrumbs"><span>Commerce Platform</span><b>/</b><strong>Admin Panel</strong></div>
      <div class="topbar-actions">
        <button type="button" class="icon-button" aria-label="Notifications">♧<i></i></button>
        <span class="topbar-divider"></span>
        <a class="topbar-profile" routerLink="/dashboard" aria-label="Platform Owner profile">
          <span class="user-avatar">PO</span><span>Platform Owner</span><b>⌄</b>
        </a>
      </div>
    </header>

    <router-outlet />
